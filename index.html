<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card - Loraine Occeña</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .profile-card {
      background-color: #fff;
      width: 300px;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      text-align: center;
    }

    .profile-card img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #4CAF50;
      margin-bottom: 15px;
    }

    .profile-card h2 {
      margin: 10px 0 5px;
      color: #333;
    }

    .profile-card p {
      margin: 0;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="profile-card">
    <!-- Replace this link with your actual picture -->

    <h2>Loraine Occeña</h2>
    <p>BSIT 3F</p>
  </div>

</body>
</html>
